<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Categories — Phones, Laptops, Audio, Gaming | ElectroHub Malawi</title>
<meta name="description" content="Browse all electronics categories in Malawi. Phones, Laptops, Audio, Gaming, Accessories. Top brands Apple, Samsung, HP, Dell, Sony. Area 47 Lilongwe.">
<link rel="canonical" href="https://electrohub.mw/categories.html">
<meta name="theme-color" content="#0A8A4B">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
<style>
:root{--green:#0A8A4B;--bg:#F6F7F9;--card:#fff;--border:#EEF1F4;--text:#121A26;--muted:#8A94A6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{overflow-x:hidden;width:100%} body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
.tap{transition:transform .15s,opacity .15s} .tap:active{transform:scale(.96)}
.d-nav{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 5%}
.logo{font-weight:800;font-size:19px} .logo span{color:var(--green)}
.d-links{display:flex;gap:24px} .d-links a{font-size:13px;font-weight:600;color:var(--muted)} .d-links a.active{color:var(--text);border-bottom:2px solid var(--green);padding-bottom:4px}
.wrap{flex:1;max-width:1100px;margin:0 auto;padding:14px 14px 20px;width:100%;display:flex;flex-direction:column}
.m-col{max-width:480px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:14px}
.search{height:46px;background:#fff;border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;padding:0 14px;gap:10px;width:100%}
.search input{flex:1;border:none;outline:none;font-size:13px;font-weight:500;background:transparent}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #E8F5E9}
.grid{margin-top:4px;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.cat-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cat-card .top{display:flex;justify-content:space-between;align-items:center}
.cat-card .ic{width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center;border:1px solid var(--border)}
.cat-card h3{font-size:13px;font-weight:800} .cat-card small{font-size:11px;color:var(--muted)}
.cat-card .count{font-size:11px;font-weight:700;background:#E8F5E9;color:var(--green);height:24px;padding:0 10px;border-radius:20px;display:inline-flex;align-items:center}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px} .sub span{font-size:10px;background:var(--bg);border:1px solid var(--border);padding:4px 8px;border-radius:20px;font-weight:600}
.m-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;display:grid;grid-template-columns:repeat(5,1fr);width:100%}
.m-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:600;color:var(--muted);padding:4px} .m-nav a.active{color:var(--green)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:99;display:none;white-space:nowrap}
.skeleton{height:120px;background:linear-gradient(90deg,#EEF1F4 25%,#F6F7F9 50%,#EEF1F4 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:20px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.footer{margin-top:auto;width:100vw;margin-left:calc(-50vw + 50%);background:#fff;border-top:1px solid var(--border);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.footer a{color:var(--text);font-weight:600;text-decoration:none} .footer a.powered{color:var(--green);font-weight:800} .footer-links{display:flex;gap:16px;align-items:center}
@media(max-width:1000px){.d-nav{display:none} .footer{display:none!important} .wrap{padding-bottom:90px}}
@media(min-width:1001px){.m-col{max-width:100%;margin:0} .grid{grid-template-columns:repeat(4,1fr)} .m-nav{display:none!important}}
</style>
</head>
<body>

<nav class="d-nav">
  <div class="logo">Electro<span>Hub</span> .MW</div>
  <div class="d-links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a class="active" href="categories.html">Categories</a><a href="track.html">Track</a><a href="profile.html">Profile</a></div>
</nav>

<div class="wrap">
<div class="m-col">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><h2 style="font-size:16px;font-weight:800">All Categories</h2><div style="font-size:11px;color:var(--muted)" id="totalCats">Loading...</div></div>
  <div class="search tap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="1.6"><circle cx="11" cy="11" r="5"/><path d="m16 16-2.5-2.5" stroke-linecap="round"/></svg><input id="searchInput" placeholder="Search categories, brands..."></div>
  <div class="grid" id="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  <div class="card">
    <h4 style="font-size:13px;font-weight:800">Top Brands by Category</h4>
    <div id="brandsByCat" style="margin-top:10px;display:grid;gap:8px"></div>
  </div>

  <footer class="footer">
    <div>Powered by <a class="powered" href="https://lostloyalty.tech" target="_blank">lostloyaltytech</a></div>
    <div class="footer-links"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><span>© 2026 ElectroHub</span></div>
  </footer>
</div>
</div>

<div class="m-nav">
  <a href="index.html" class="tap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9 12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-linecap="round"/></svg>Home</a>
  <a href="shop.html" class="tap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Shop</a>
  <a class="active tap" href="categories.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 12l10 5 10-5" stroke-linecap="round"/><path d="M2 17l10 5 10-5" stroke-linecap="round"/></svg>Categories</a>
  <a href="track.html" class="tap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6" stroke-linecap="round"/></svg>Track</a>
  <a href="profile.html" class="tap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M20 20a8 8 0 1 0-16 0" stroke-linecap="round"/></svg>Profile</a>
</div>

<div class="toast" id="toast"></div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
const APPWRITE_ENDPOINT="https://fra.cloud.appwrite.io/v1";
const APPWRITE_PROJECT="electrohub";
const DB_ID="electronic_db";
const COL_PRODUCTS="products";
const client=new Appwrite.Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT);
let allProducts=[];
const iconMap={
  Phones:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="6" y="2" width="12" height="20" rx="3" fill="#0A8A4B" opacity=".14" stroke="#0A8A4B" stroke-width="1.2"/><rect x="8" y="4" width="8" height="12" rx="1" fill="#fff" stroke="#0A8A4B" stroke-width="1"/></svg>`,
  Laptops:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="11" rx="2" fill="#6366F1" opacity=".14" stroke="#6366F1" stroke-width="1.2"/><path d="M2 18h20l-1 2H3l-1-2z" fill="#6366F1" opacity=".5"/></svg>`,
  Audio:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 12c0-5 4-9 9-9s9 4 9 9" stroke="#FF8A00" stroke-width="1.3" stroke-linecap="round"/><rect x="3" y="12" width="4" height="6" rx="2" fill="#FF8A00" opacity=".18" stroke="#FF8A00" stroke-width="1.2"/><rect x="17" y="12" width="4" height="6" rx="2" fill="#FF8A00" opacity=".18" stroke="#FF8A00" stroke-width="1.2"/></svg>`,
  Gaming:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="10" rx="5" fill="#E91E63" opacity=".14" stroke="#E91E63" stroke-width="1.2"/><circle cx="8" cy="12" r="1.2" fill="#E91E63"/><circle cx="16" cy="12" r="1.2" fill="#E91E63"/></svg>`,
  Accessories:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 3L7 7h10l-2-4H9z" fill="#0EA5E9" opacity=".18" stroke="#0EA5E9" stroke-width="1.2"/><rect x="7" y="7" width="10" height="11" rx="2" fill="#fff" stroke="#0EA5E9" stroke-width="1.2"/></svg>`,
}

async function fetchProducts(){
  try{
    let res;
    try{ const tables=new Appwrite.TablesDB(client); res=await tables.listRows(DB_ID,COL_PRODUCTS,[Appwrite.Query.limit(100),Appwrite.Query.orderDesc('$createdAt')]); }
    catch{ const db=new Appwrite.Databases(client); res=await db.listDocuments(DB_ID,COL_PRODUCTS,[Appwrite.Query.limit(100),Appwrite.Query.orderDesc('$createdAt')]); }
    allProducts=res.rows||res.documents||[];
    if(!allProducts.length) throw new Error("empty");
    render();
  }catch(e){
    document.getElementById('grid').innerHTML=`<div style="grid-column:1/-1;padding:14px;background:#fff;border:1px solid #FECACA;border-radius:12px;font-size:12px;color:#EF4444">No categories yet — add products in Admin. ${e.message}</div>`;
  }
}

function render(filter=""){
  filter=filter.toLowerCase();
  const grouped={};
  allProducts.forEach(p=>{
    const cat=p.category||"Other";
    if(filter && !`${cat} ${p.name||''} ${p.brand||''}`.toLowerCase().includes(filter)) return;
    if(!grouped[cat]) grouped[cat]={count:0, brands:new Set(), samples:[]};
    grouped[cat].count++; grouped[cat].brands.add(p.brand||"Generic"); if(grouped[cat].samples.length<3) grouped[cat].samples.push(p);
  });
  const cats=Object.entries(grouped);
  document.getElementById('totalCats').textContent=`${cats.length} categories • ${allProducts.length} products`;
  const grid=document.getElementById('grid');
  if(!cats.length){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--muted);font-size:12px">No categories match</div>`; return}
  grid.innerHTML=cats.map(([cat, data])=>`
    <div class="cat-card tap" onclick="location.href='shop.html?cat=${encodeURIComponent(cat)}'">
      <div class="top"><div class="ic">${iconMap[cat]||iconMap['Accessories']}</div><span class="count">${data.count} items</span></div>
      <div><h3>${cat}</h3><small>${Array.from(data.brands).slice(0,3).join(' • ')}</small></div>
      <div class="sub">${data.samples.map(s=>`<span>${(s.brand||'').slice(0,10)}</span>`).join('')}<span style="background:var(--green);color:#fff;border-color:var(--green)">View</span></div>
    </div>
  `).join('');
  document.getElementById('brandsByCat').innerHTML=cats.map(([cat,data])=>`
    <div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:10px;border-radius:12px">
      <div><div style="font-size:12px;font-weight:700">${cat}</div><div style="font-size:11px;color:var(--muted)">${Array.from(data.brands).join(', ')}</div></div>
      <button class="tap" onclick="location.href='shop.html?cat=${encodeURIComponent(cat)}'" style="height:30px;padding:0 12px;border-radius:20px;background:#fff;border:1px solid var(--border);font-size:11px;font-weight:700">Shop</button>
    </div>
  `).join('');
}
document.getElementById('searchInput').addEventListener('input', e=>render(e.target.value));
fetchProducts();
</script>
</body>
</html>

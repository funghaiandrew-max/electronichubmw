<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shop Electronics — ElectroHub Malawi | Phones, Laptops, Audio, Gaming Lilongwe</title>
<meta name="description" content="Shop electronics in Lilongwe Malawi. iPhone, Samsung, HP, Dell, Sony, PS5. Filter by brand, price, stock. Airtel Money & TNM Mpamba. Area 47.">
<link rel="canonical" href="https://electrohub.mw/shop.html">
<meta name="theme-color" content="#0A8A4B">
<meta property="og:type" content="website">
<meta property="og:title" content="Shop — ElectroHub Malawi">
<meta property="og:description" content="Live stock from Lilongwe. Phones, Laptops, Audio, Gaming.">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
<style>
:root{--green:#0A8A4B;--bg:#F6F7F9;--card:#fff;--border:#EEF1F4;--text:#121A26;--muted:#8A94A6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
.tap{transition:transform .15s,opacity .15s} .tap:active{transform:scale(.96)}
.d-nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 5%;gap:20px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px} .logo span{color:var(--green)}
.d-links{display:flex;gap:8px;align-items:center} .d-links a{font-size:13px;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:20px} .d-links a.active{background:var(--text);color:#fff}
.d-search{flex:1;max-width:380px;height:40px;background:var(--bg);border:1px solid var(--border);border-radius:20px;display:flex;align-items:center;padding:0 14px;gap:10px}
.d-search input{flex:1;border:none;outline:none;font-size:13px;font-weight:500;background:transparent}
.wrap{flex:1;max-width:1280px;width:100%;margin:0 auto;padding:14px 14px 20px;display:grid;grid-template-columns:260px 1fr;gap:16px}
.m-col{max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.search{height:44px;background:#fff;border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;padding:0 14px;gap:10px;width:100%}
.search input{flex:1;border:none;outline:none;font-size:13px;font-weight:500;background:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0} .chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;height:32px;padding:0 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:6px}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.side{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px;position:sticky;top:76px;height:fit-content}
.side h4{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 10px} .side h4:first-child{margin-top:0}
.filter-btn{width:100%;text-align:left;height:36px;padding:0 12px;border-radius:10px;background:#fff;border:1px solid var(--border);font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.filter-btn.active{border-color:var(--green);background:#E8F5E9;color:var(--green)}
.range{display:flex;gap:8px} .range input{width:100%;height:36px;border:1px solid var(--border);border-radius:10px;padding:0 10px;font-size:12px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:10px;position:relative;display:flex;flex-direction:column}
.card img{width:100%;height:100px;object-fit:contain} .card .price{font-size:12px;font-weight:800;margin-top:6px} .card .name{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3;height:26px;overflow:hidden}
.card .meta{font-size:10px;margin-top:4px;display:flex;justify-content:space-between}
.add{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center}
.top-bar h3{font-size:13px;font-weight:800} .top-bar select{height:34px;border:1px solid var(--border);border-radius:10px;padding:0 10px;font-size:12px;font-weight:600;background:#fff}
.m-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;display:grid;grid-template-columns:repeat(5,1fr);width:100%}
.m-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:600;color:var(--muted);padding:4px} .m-nav a.active{color:var(--green)}
.drawer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:24px 24px 0 0;border-top:1px solid var(--border);padding:16px 14px calc(16px + env(safe-area-inset-bottom));z-index:50;transform:translateY(100%);transition:transform .3s ease;max-height:75vh;overflow:auto}
.drawer.open{transform:translateY(0)} .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:49;display:none} .overlay.show{display:block}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:99;display:none;white-space:nowrap}
.skeleton{height:150px;background:linear-gradient(90deg,#EEF1F4 25%,#F6F7F9 50%,#EEF1F4 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:18px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.footer{margin-top:auto;width:100vw;margin-left:calc(-50vw + 50%);background:#fff;border-top:1px solid var(--border);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.footer a{color:var(--text);font-weight:600;text-decoration:none} .footer a.powered{color:var(--green);font-weight:800} .footer-links{display:flex;gap:16px;align-items:center}
@media(max-width:1000px){.wrap{grid-template-columns:1fr} .d-nav{display:none} .side{display:none} .footer{display:none!important} .wrap{padding-bottom:90px}}
@media(min-width:1001px){.m-col{max-width:100%;margin:0} .grid{grid-template-columns:repeat(3,1fr)} .m-nav,.drawer,.overlay{display:none!important} .mobile-search-wrap{display:none!important}}
</style>
</head>
<body>

<nav class="d-nav">
  <div class="logo">Electro<span>Hub</span> .MW</div>
  <div class="d-links"><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a href="categories.html">Categories</a><a href="track.html">Track</a><a href="profile.html">Profile</a></div>
  <div class="d-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="1.8"><circle cx="11" cy="11" r="5"/><path d="m15.5 15.5-2.5-2.5" stroke-linecap="round"/></svg><input id="desktopSearch" placeholder="Search iPhone, HP, Sony..."></div>
</nav>

<div class="wrap">
  <div class="side">
    <h4>Categories</h4><div id="catFilters"></div>
    <h4>Brands</h4><div id="brandFilters"></div>
    <h4>Price (MK)</h4><div class="range"><input id="minPrice" type="number" placeholder="Min"><input id="maxPrice" type="number" placeholder="Max"></div>
    <h4>Stock</h4>
    <button class="filter-btn tap" data-stock="all" onclick="setStock('all')">All stock</button>
    <button class="filter-btn tap" data-stock="in" onclick="setStock('in')">In Stock only</button>
    <button class="filter-btn tap" data-stock="low" onclick="setStock('low')">Low stock (&lt;5)</button>
    <button onclick="clearFilters()" style="margin-top:14px;width:100%;height:40px;background:var(--text);color:#fff;border-radius:12px;font-weight:700;font-size:12px" class="tap">Clear Filters</button>
  </div>

  <div class="m-col">
    <div class="mobile-search-wrap">
      <div class="search tap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="1.6"><circle cx="11" cy="11" r="5"/><path d="m16 16-2.5-2.5" stroke-linecap="round"/></svg><input id="searchInput" placeholder="Search electronics..."><button class="tap" onclick="openDrawer()" style="width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;border:1px solid var(--border)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#121A26" stroke-width="1.6"><path d="M3 6h18M7 12h10M10 18h4" stroke-linecap="round"/></svg></button></div>
    </div>

    <div class="chips" id="catChips"></div>
    <div class="top-bar"><h3 id="count">Loading...</h3><select id="sort" onchange="applyFilters()"><option value="new">Newest</option><option value="low">Low to High</option><option value="high">High to Low</option><option value="stock">Most Stock</option></select></div>
    <div class="grid" id="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

    <footer class="footer">
      <div>Powered by <a class="powered" href="https://lostloyalty.tech" target="_blank">lostloyaltytech</a></div>
      <div class="footer-links"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><span>© 2026 ElectroHub</span></div>
    </footer>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div style="width:40px;height:4px;background:#E2E8F0;border-radius:10px;margin:0 auto 14px"></div>
  <h4 style="font-size:13px;font-weight:800;margin-bottom:10px">Filters</h4>
  <div id="mCatFilters"></div><div id="mBrandFilters" style="margin-top:12px"></div>
  <div class="range" style="margin-top:12px"><input id="mMinPrice" type="number" placeholder="Min MK"><input id="mMaxPrice" type="number" placeholder="Max MK"></div>
  <button onclick="applyFilters(); closeDrawer()" style="margin-top:14px;width:100%;height:44px;background:var(--green);color:#fff;border-radius:12px;font-weight:700" class="tap">Apply Filters</button>
</div>

<div class="m-nav">
  <a href="index.html" class="tap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9 12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-linecap="round"/></svg>Home</a>
  <a class="active tap" href="shop.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Shop</a>
  <a href="categories.html" class="tap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="5"/><path d="m21 21-3.5-3.5" stroke-linecap="round"/></svg>Categories</a>
  <a href="track.html" class="tap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Track</a>
  <a href="profile.html" class="tap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M20 20a8 8 0 1 0-16 0" stroke-linecap="round"/></svg>Profile</a>
</div>

<div class="toast" id="toast"></div>

<script>
const APPWRITE_ENDPOINT="https://fra.cloud.appwrite.io/v1";
const APPWRITE_PROJECT="electrohub";
const DB_ID="electronic_db";
const COL_PRODUCTS="products";
const client=new Appwrite.Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT);
let allProducts=[]; let filtered=[]; let activeCat="All"; let activeBrand="All"; let stockFilter="all";
function showToast(m){const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2500)}
const catIcons={
  All:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="#0A8A4B" opacity=".18" stroke="#0A8A4B" stroke-width="1"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#0A8A4B" opacity=".18" stroke="#0A8A4B" stroke-width="1"/></svg>`,
  Phones:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="7" y="2" width="10" height="20" rx="2" fill="#0A8A4B" opacity=".14" stroke="#0A8A4B" stroke-width="1.1"/></svg>`,
  Laptops:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="12" rx="2" fill="#6366F1" opacity=".14" stroke="#6366F1" stroke-width="1.1"/></svg>`,
}
async function fetchProducts(){
  try{
    let res;
    try{ const tables=new Appwrite.TablesDB(client); res=await tables.listRows(DB_ID,COL_PRODUCTS,[Appwrite.Query.limit(100),Appwrite.Query.orderDesc('$createdAt')]); }
    catch{ const db=new Appwrite.Databases(client); res=await db.listDocuments(DB_ID,COL_PRODUCTS,[Appwrite.Query.limit(100),Appwrite.Query.orderDesc('$createdAt')]); }
    allProducts=res.rows||res.documents||[];
    if(!allProducts.length) throw new Error('No products in Appwrite yet');
    buildFilters(); applyFilters();
  }catch(e){
    document.getElementById('grid').innerHTML=`<div style="grid-column:1/-1;padding:14px;background:#fff;border:1px solid #FECACA;border-radius:12px;font-size:12px;color:#EF4444">Failed: ${e.message}<br>Check DB_ID ${DB_ID} exists in FRA project.</div>`;
  }
}
function buildFilters(){
  const cats=["All",...new Set(allProducts.map(p=>p.category).filter(Boolean))];
  const brands=["All",...new Set(allProducts.map(p=>p.brand).filter(Boolean))];
  document.getElementById('catChips').innerHTML=cats.map(c=>{
    const ic=catIcons[c]||catIcons['All'];
    return `<button class="chip tap ${activeCat===c?'active':''}" onclick="setCat('${c}')">${ic} ${c}</button>`
  }).join('');
  document.getElementById('catFilters').innerHTML=cats.map(c=>`<button class="filter-btn tap ${activeCat===c?'active':''}" onclick="setCat('${c}')">${c}<span>${c==='All'?allProducts.length:allProducts.filter(p=>p.category===c).length}</span></button>`).join('');
  document.getElementById('mCatFilters').innerHTML=document.getElementById('catFilters').innerHTML;
  document.getElementById('brandFilters').innerHTML=brands.map(b=>`<button class="filter-btn tap ${activeBrand===b?'active':''}" onclick="setBrand('${b}')">${b}</button>`).join('');
  document.getElementById('mBrandFilters').innerHTML=document.getElementById('brandFilters').innerHTML;
}
function setCat(c){activeCat=c; buildFilters(); applyFilters()}
function setBrand(b){activeBrand=b; buildFilters(); applyFilters()}
function setStock(s){stockFilter=s; document.querySelectorAll('[data-stock]').forEach(b=>b.classList.toggle('active',b.dataset.stock===s)); applyFilters()}
function clearFilters(){activeCat="All"; activeBrand="All"; stockFilter="all"; const s=document.getElementById('searchInput'); const d=document.getElementById('desktopSearch'); if(s) s.value=""; if(d) d.value=""; document.getElementById('minPrice').value=""; document.getElementById('maxPrice').value=""; document.getElementById('mMinPrice').value=""; document.getElementById('mMaxPrice').value=""; buildFilters(); applyFilters()}
function applyFilters(){
  let q=(document.getElementById('searchInput')?.value||document.getElementById('desktopSearch')?.value||"").toLowerCase();
  let min=Number(document.getElementById('minPrice').value||document.getElementById('mMinPrice').value||0);
  let max=Number(document.getElementById('maxPrice').value||document.getElementById('mMaxPrice').value||999999999);
  let sort=document.getElementById('sort').value;
  filtered=allProducts.filter(p=>{
    if(activeCat!=="All" && p.category!==activeCat) return false;
    if(activeBrand!=="All" && p.brand!==activeBrand) return false;
    if(Number(p.price)<min || Number(p.price)>max) return false;
    if(stockFilter==="in" && Number(p.stock)<=0) return false;
    if(stockFilter==="low" && Number(p.stock)>=5) return false;
    if(q && !`${p.name} ${p.category} ${p.brand}`.toLowerCase().includes(q)) return false;
    return true;
  });
  if(sort==="low") filtered.sort((a,b)=>a.price-b.price);
  if(sort==="high") filtered.sort((a,b)=>b.price-a.price);
  if(sort==="stock") filtered.sort((a,b)=>b.stock-a.stock);
  document.getElementById('count').textContent=`${filtered.length} items • ${activeCat}${activeBrand!=="All"?" • "+activeBrand:""}`;
  render(filtered);
}
function render(list){
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted);font-size:12px">No products match — ${allProducts.length} total in Lilongwe</div>`; return}
  grid.innerHTML=list.map(p=>{
    const stock=Number(p.stock||0);
    return `<div class="card tap" onclick="location.href='product.html?id=${p.$id}'">
      <img src="${p.image}" loading="lazy" alt="${p.name}"><div class="price">MK ${Number(p.price).toLocaleString()}</div><div class="name">${p.name}</div>
      <div class="meta"><span style="color:${stock<5?'#EF4444':'var(--green)'}">${stock<5?`Only ${stock} left`:`${stock} in stock`}</span><span style="color:var(--muted)">${p.brand||''}</span></div>
      <div class="add" onclick="event.stopPropagation(); addCart('${p.$id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg></div>
    </div>`
  }).join('');
}
function addCart(id){let c=JSON.parse(localStorage.getItem('eh_cart')||'[]'); c.push(id); localStorage.setItem('eh_cart',JSON.stringify(c)); showToast('Added to cart')}
document.getElementById('searchInput')?.addEventListener('input', applyFilters);
document.getElementById('desktopSearch')?.addEventListener('input', e=>{const m=document.getElementById('searchInput'); if(m) m.value=e.target.value; applyFilters()});
document.getElementById('minPrice')?.addEventListener('input', applyFilters);
document.getElementById('maxPrice')?.addEventListener('input', applyFilters);
function openDrawer(){document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.add('show')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('show')}
fetchProducts();
</script>
</body>
</html>
